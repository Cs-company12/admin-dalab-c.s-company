<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WhatsApp Contacts</title>
</head>
<body>

<button onclick="openWhatsApps()">Open WhatsApp Chats</button>

<script>
function openWhatsApps() {
    const numbers = [
        "252615444482",
        "252615501225",
        "252615872673",
        "252614060606",
        "252772907777"
    ];

    const message = "Asc. Ma haysaan Raised Toilet Seat ama Toilet Lift Seat? Fadlan ii soo dira qiimaha iyo sawirka.";

    numbers.forEach((number, index) => {
        setTimeout(() => {
            window.open(
                `https://wa.me/${number}?text=${encodeURIComponent(message)}`,
                "_blank"
            );
        }, index * 1000);
    });
}
</script>

</body>
</html>
